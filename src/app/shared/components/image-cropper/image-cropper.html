<div class="modal-overlay d-flex align-items-center justify-content-center">
    <div class="modal-container modern-card p-4 shadow-lg d-flex flex-column">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0 text-muted">Crop Image</h5>
            <button class="btn-close" (click)="cancelCrop()"></button>
        </div>

        <div class="cropper-wrapper flex-grow-1 mb-4 bg-dark rounded-3 overflow-hidden">
            <!-- The image MUST be wrapped in a block container for Cropper.js to work -->
            @if (imageUrl) {
            <img #imageElement [src]="imageUrl" alt="Target" class="cropper-target">
            }
        </div>

        <div class="d-flex justify-content-end gap-2">
            <button class="btn btn-light fw-medium px-4 rounded-pill" (click)="cancelCrop()">Cancel</button>
            <button class="btn btn-primary fw-bold px-4 rounded-pill action-btn" (click)="applyCrop()">Apply
                Crop</button>
        </div>
    </div>
</div>
