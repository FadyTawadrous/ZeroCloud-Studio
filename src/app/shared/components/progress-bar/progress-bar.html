<div class="card modern-card p-4 text-start shadow-sm w-100" aria-live="polite">
    <!-- Header: Status Text & Percentage -->
    <div class="d-flex justify-content-between align-items-end mb-2">
        <span class="fw-bold text-primary status-text text-truncate pe-3">
            {{ status }}
        </span>
        <span class="text-muted small fw-bold font-monospace">
            {{ safeProgress }}%
        </span>
    </div>

    <!-- The Animated Track -->
    <div class="progress mb-3 bg-body-secondary rounded-pill" style="height: 12px;">
        <div class="progress-bar progress-bar-striped progress-bar-animated rounded-pill custom-gradient-bar"
            role="progressbar" [attr.aria-valuenow]="safeProgress" aria-valuemin="0" aria-valuemax="100"
            [style.width]="safeProgress + '%'">
        </div>
    </div>

    <!-- Optional Cancel Button -->
    @if (showCancel) {
    <div class="text-end mt-1">
        <button class="btn btn-outline-danger btn-sm rounded-pill px-4 fw-medium cancel-btn" (click)="onCancel()">
            Cancel Processing
        </button>
    </div>
    }
</div>
