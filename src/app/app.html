<!-- Modern Glass Navbar -->
<nav class="navbar navbar-expand-lg navbar-glass sticky-top px-2 py-2 shadow-sm">
  <div class="container">
    <!-- Brand acts as Home Link -->
    <a class="navbar-brand fw-bold fs-4 text-gradient d-flex align-items-center me-0 gap-2" routerLink="/" title="Home">
      <img src="icons/logo.svg" alt="ZeroCloud Logo" width="32" height="32" class="rounded">
      ZeroCloud Studio
    </a>

    <button (click)="isNavCollapsed = !isNavCollapsed" [attr.aria-expanded]="!isNavCollapsed" aria-controls="navbarNav"
      aria-label="Toggle navigation" class="navbar-toggler border-0 shadow-none" type="button">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-center" id="navbarNav" [ngbCollapse]="isNavCollapsed">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link nav-pill-modern" routerLink="/images" routerLinkActive="active"
            (click)="isNavCollapsed = true">Images</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-pill-modern" routerLink="/audio" routerLinkActive="active"
            (click)="isNavCollapsed = true">Audio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-pill-modern" routerLink="/video" routerLinkActive="active"
            (click)="isNavCollapsed = true  ">Video</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-pill-modern" routerLink="/pdf" routerLinkActive="active"
            (click)="isNavCollapsed = true">PDFs</a>
        </li>
      </ul>

      <!-- Mobile Theme Toggle (Visible only on small screens inside the menu) -->
      <div class="d-lg-none mt-3 pt-3 border-top" style="border-color: var(--bs-border-color) !important;">
        <button class="theme-toggle-btn w-100 d-flex justify-content-center align-items-center gap-2"
          (click)="toggleTheme()">
          @if (isDarkMode) {
          <span>☀️ Switch to Light Mode</span>
          } @else {
          <span>🌙 Switch to Dark Mode</span>
          }
        </button>
      </div>
    </div>

    <!-- Right Aligned Desktop Theme Toggle (Visible only on large screens) -->
    <div class="d-none d-lg-flex">
      <button class="theme-toggle-btn d-flex align-items-center gap-2" (click)="toggleTheme()">
        @if (isDarkMode) {
        <span>☀️ Light</span>
        } @else {
        <span>🌙 Dark</span>
        }
      </button>
    </div>

  </div>
</nav>

<!-- Dynamic Content -->
<main class="flex-grow-1 my-5">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</main>
